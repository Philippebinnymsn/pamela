name: Backup diário do Supabase

on:
  schedule:
    # Todo dia às 06:00 UTC (~03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  # workflow_dispatch permite rodar manualmente pelo site do GitHub, pra testar

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar cliente do Postgres (versão compatível com o Supabase)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Criar backup do banco de dados
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          DATA=$(date +'%Y-%m-%d')
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges --schema=public -f "backups/backup-$DATA.sql"

      - name: Remover backups com mais de 30 dias (evita o repositório crescer demais)
        run: |
          find backups -name "backup-*.sql" -mtime +30 -delete || true

      - name: Salvar o backup no repositório
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup automático $(date +'%Y-%m-%d')"
          git push
